name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Rust — format et lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust — tests (métier, comptes, journal, chiffrement, démarrage)
        run: cargo test --workspace

      - name: Types TypeScript générés à jour
        if: runner.os == 'Linux'
        run: git diff --exit-code -- src/bindings || (echo "::error::Lancez 'npm run types' et committez src/bindings" && exit 1)

      - name: Interface — types et tests
        run: |
          npm run typecheck
          npm test

      - name: Compilation de l'application
        run: npm run tauri build -- --no-bundle
