[workspace]
members = ["crates/tanana-core", "crates/tanana-protocole", "crates/tanana-relais", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "UNLICENSED"

# Argon2 et SQLCipher sont très lents sans optimisation : on optimise les
# dépendances même en développement (les tests restent rapides).
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
